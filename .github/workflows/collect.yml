name: OnCreate Public Healthcare Discovery

on:
  # Free OpenStreetMap and first-party registry validation run (no search API credits).
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "scripts/**"
      - "README.md"
  schedule:
    # Check manually requested collections every 5 minutes (no work if idle).
    - cron: "*/5 * * * *"
    # Keep overnight scheduled research as before.
    - cron: "10 3 * * *"
    - cron: "55 8 * * *"
  workflow_dispatch:
    inputs:
      max_runtime_minutes:
        description: "Maximum research minutes for this run (10-340)"
        default: "340"
        required: false
        type: string
      max_candidates:
        description: "Maximum candidate records per run (25-12000)"
        default: "3000"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: oncreate-public-collector
  cancel-in-progress: false

jobs:
  collect:
    # Never execute the long-runner or consume private-repository minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ONCREATE_INGEST_URL: ${{ vars.ONCREATE_INGEST_URL || 'https://bolslnqrinkeeqpjwkdr.supabase.co/functions/v1/oncreate-lead-ingest' }}
      ONCREATE_INGEST_TOKEN: ${{ secrets.ONCREATE_INGEST_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      # Metered search providers stay OFF regardless of existing keys.
      ALLOW_METERED_SEARCH: "false"
      # Optional cents-scale model review; only runs for explicitly selected FREE_PLUS jobs.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CONTACT_REVIEW: "true"
      CLAUDE_MAX_CALLS_PER_CITY: "2"
      CLAUDE_RUN_MAX_CALLS: "8"
      DISCOVERY_ENABLE_APOLLO: "false"
      COLLECTION_MODE: ${{ (github.event.schedule == '10 3 * * *' || github.event.schedule == '55 8 * * *' || github.event_name == 'workflow_dispatch') && 'scheduled' || 'poll' }}
      DISCOVERY_DELAY_SECONDS: "3"
      MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes || (github.event.schedule == '55 8 * * *' && '70' || '180') }}
      MAX_DAILY_CANDIDATES: ${{ inputs.max_candidates || '3000' }}
      DISCOVERY_DAILY_SEARCH_CREDITS: "20"
      DISCOVERY_MONTHLY_SEARCH_CREDITS: "600"
      DISCOVERY_ROUND_CANDIDATES: "120"
      DISCOVERY_OSM_CITY_LIMIT: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector guardrails
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Require signed GitHub job or private intake secret
        run: |
          if [ -z "$ONCREATE_INGEST_URL" ] || { [ -z "$ONCREATE_INGEST_TOKEN" ] && [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; }; then
            echo "Enable GitHub id-token: write and supply an HTTPS intake URL."
            exit 1
          fi
      # Geographic catalog is seeded on demand inside run_daily.py.
      - name: Collect candidates using permitted sources
        run: python scripts/run_daily.py
